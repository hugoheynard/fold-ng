<sh3-page-layout
  fluid
  title="app-shell"
  icon="grid"
  description="The application frame: a primary icon rail, an optional secondary rail, a header band and the content area, wired as one responsive scaffold. It folds on its own width via container queries — the secondary rail collapses first, then the primary — so the same markup serves desktop, tablet and mobile. Appearance (flat or floating), header layout (inset or full), rail width and header height are inputs; everything else is a design token you can override."
>
  <gal-kind-badge titleBadge kind="component" />

  <dev-playground [code]="shellCode()">
    <div class="np-field" params>
      <span class="gal-tag">appearance</span>
      <div class="ss-seg">
        <button
          type="button"
          [class.is-on]="shellAppearance() === 'flat'"
          (click)="setAppearance('flat')"
        >
          flat
        </button>
        <button
          type="button"
          [class.is-on]="shellAppearance() === 'floating'"
          (click)="setAppearance('floating')"
        >
          floating
        </button>
      </div>
    </div>

    <div class="np-field" params>
      <span class="gal-tag">headerLayout</span>
      <div class="ss-seg">
        <button
          type="button"
          [class.is-on]="shellHeaderLayout() === 'inset'"
          (click)="setHeaderLayout('inset')"
        >
          inset
        </button>
        <button
          type="button"
          [class.is-on]="shellHeaderLayout() === 'full'"
          (click)="setHeaderLayout('full')"
        >
          full
        </button>
      </div>
    </div>

    <sh3-slider
      params
      label="railWidth"
      [min]="48"
      [max]="120"
      [valueText]="shellRailWidth() + 'px'"
      [(value)]="shellRailWidth"
    />
    <sh3-slider
      params
      label="headerHeight"
      [min]="44"
      [max]="88"
      [valueText]="shellHeaderHeight() + 'px'"
      [(value)]="shellHeaderHeight"
    />

    <div class="ss-seg" preview-actions>
      @for (m of shellModes; track m) {
      <button
        type="button"
        [class.is-on]="shellMode() === m"
        (click)="shellMode.set(m)"
      >
        {{ m }}
      </button>
      }
    </div>

    <!-- A real shell at real pixel width, scaled to fit; folds on its own width
       (container queries) so the mode switch truly collapses the rails. -->
    <div class="shell-window" #shellWindow>
      <div
        class="shell-preview"
        [style.width.px]="shellWidth()"
        [style.zoom]="shellScale()"
        panelScope
        #sph="panelScope"
      >
        <sh3-app-shell
          [appearance]="shellAppearance()"
          [headerLayout]="shellHeaderLayout()"
          [railWidth]="shellRailWidth()"
          [headerHeight]="shellHeaderHeight()"
        >
          <sh3-menu railPrimary tint="primary">
            <div header class="rail-brand">S3</div>
            @for (i of railNav; track i.id) {
            <button
              sh3-menu-item
              [icon]="i.icon"
              [label]="i.label"
              [active]="previewNav() === i.id"
              (click)="previewNav.set(i.id)"
            ></button>
            }
            <button
              footer
              sh3-menu-item
              icon="settings"
              label="Settings"
            ></button>
          </sh3-menu>
          <sh3-menu railSecondary level="secondary" [expanded]="true">
            <div header class="lib-head">Workspace</div>
            <button
              sh3-menu-item
              icon="grid"
              label="Overview"
              [active]="true"
            ></button>
            <button sh3-menu-item icon="contracts" label="Contracts"></button>
            <button sh3-menu-item icon="music" label="Library"></button>
          </sh3-menu>
          <div header class="sp-header">
            <span>Header</span>
            <div class="sp-actions">
              <button type="button" (click)="openPreviewPanel(sph.service)">
                <sh3-icon name="contracts" size="sm" />
                Open panel
              </button>
              <button type="button" (click)="toggleTheme()">
                <sh3-icon
                  [name]="theme() === 'dark' ? 'theme-light' : 'theme-dark'"
                  size="sm"
                />
                {{ theme() === "dark" ? "Light" : "Dark" }}
              </button>
            </div>
          </div>
          <div class="sp-content">
            <div class="sp-block"></div>
            <div class="sp-block"></div>
          </div>

          <!-- the preview's own panel host — panels open inside the preview -->
          <sh3-panel-host />
        </sh3-app-shell>
      </div>
    </div>
  </dev-playground>
</sh3-page-layout>
