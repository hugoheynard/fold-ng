<fold-page-layout title="button-icon">
  <gal-kind-badge titleBadge kind="component" />
  <div class="gal-stack">
    <div class="gal-cell">
      <span class="gal-tag">tones (md square)</span>
      <div class="gal-row" style="align-items: center">
        <fold-button-icon icon="edit" tooltip="Ghost (default)" />
        <fold-button-icon icon="check" tone="accent" tooltip="Accent" />
        <fold-button-icon icon="bin" tone="critical" tooltip="Critical" />
      </div>
    </div>
    <div class="gal-cell">
      <span class="gal-tag">sizes (ghost square)</span>
      <div class="gal-row" style="align-items: center">
        <fold-button-icon icon="reload" size="xs" tooltip="xs · 22px" />
        <fold-button-icon icon="reload" size="sm" tooltip="sm · 28px" />
        <fold-button-icon icon="reload" size="md" tooltip="md · 32px" />
        <fold-button-icon icon="reload" size="lg" tooltip="lg · 38px" />
      </div>
    </div>
    <div class="gal-cell">
      <span class="gal-tag">round · accent (transport)</span>
      <div class="gal-row" style="align-items: center">
        <fold-button-icon
          icon="play"
          shape="round"
          tone="accent"
          size="lg"
          tooltip="Play"
        />
        <fold-button-icon
          icon="reload"
          shape="round"
          size="md"
          tooltip="Restart"
        />
      </div>
    </div>
    <div class="gal-cell">
      <span class="gal-tag">toggle ([(active)]) · disabled</span>
      <div class="gal-row" style="align-items: center">
        <fold-button-icon
          icon="eye"
          tooltip="Toggle mask"
          [(active)]="biMasked"
        />
        <span class="gal-tag">masked: {{ biMasked() }}</span>
        <fold-button-icon icon="edit" [disabled]="true" tooltip="Disabled" />
      </div>
    </div>
  </div>
</fold-page-layout>
