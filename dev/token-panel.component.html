<header class="tp-top">
  <sh3-tab-nav
    [tabs]="tabItems()"
    [activeKey]="activeCategory()"
    (tabChange)="activeCategory.set($event)"
  />
  <button
    type="button"
    class="tp-reset"
    [disabled]="dirtyCount() === 0"
    (click)="reset()"
  >
    Reset
    @if (dirtyCount()) {
      <span class="tp-count">{{ dirtyCount() }}</span>
    }
  </button>
</header>

<div class="tp-body">
  @for (group of groups(); track group.family) {
    <section class="tp-group">
      <h3 class="tp-family">{{ group.family }}</h3>
      @for (entry of group.entries; track entry.name) {
        <label class="tp-row">
          @if (entry.kind === "color") {
            <input
              #picker
              type="color"
              class="tp-picker"
              [value]="valueOf(entry)"
              (input)="set(entry.name, picker.value)"
            />
            <span class="tp-label">{{ entry.label }}</span>
            <span class="tp-hex">{{ valueOf(entry) }}</span>
          } @else {
            <span class="tp-label">{{ entry.label }}</span>
            <input
              #field
              type="text"
              class="tp-field"
              [value]="valueOf(entry)"
              (change)="set(entry.name, field.value)"
            />
          }
        </label>
      }
    </section>
  }
</div>
