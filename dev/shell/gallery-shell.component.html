<sh3-app-shell
  contentPadding="28px 32px 40px"
  footerLayout="full"
  [appearance]="theme() === 'bubbly' ? 'floating' : 'flat'"
  (dblclick)="onInspect($event)"
>
  <!-- ── rail primary: the Fold app rail ───────────────────────────── -->
  <sh3-menu railPrimary tint="primary">
    <a header class="rail-brand" routerLink="/" aria-label="Fold — home">
      <sh3-icon name="fold" [size]="24" />
    </a>
    <a
      sh3-menu-item
      icon="home"
      label="Home"
      routerLink="/"
      routerLinkActive
      #homeRla="routerLinkActive"
      [routerLinkActiveOptions]="{ exact: true }"
      [active]="homeRla.isActive"
    ></a>
    <a
      sh3-menu-item
      icon="library"
      label="Library"
      [routerLink]="'/' + firstComponent"
      [active]="!homeRla.isActive"
    ></a>
    <button footer sh3-menu-item icon="settings" label="Settings"></button>
  </sh3-menu>

  <!-- ── rail secondary: the "Library" nav — each item is a route ──── -->
  <sh3-menu railSecondary level="secondary" [expanded]="true">
    <div header class="lib-head">
      <sh3-icon name="library" size="sm" />
      <span>Library</span>
    </div>
    @for (group of navGroups; track group.label) {
      <sh3-menu-section [label]="group.label" [color]="group.color" collapsible>
        @for (item of group.items; track item.id) {
          <a
            sh3-menu-item
            [icon]="item.icon ?? 'grid'"
            [label]="item.label"
            [routerLink]="'/' + item.id"
            routerLinkActive
            #rla="routerLinkActive"
            [active]="rla.isActive"
            [badge]="item.badge"
            [badgeTone]="item.badgeTone ?? 'follow'"
          ></a>
        }
      </sh3-menu-section>
    }
  </sh3-menu>

  <!-- ── header ────────────────────────────────────────────────── -->
  <div header class="gal-header">
    <a class="gal-title" routerLink="/">
      <sh3-icon name="fold" size="md" />
      <span>Fold</span>
      <span class="gal-title-sub">design system</span>
    </a>
    <div class="gal-themes">
      <sh3-icon name="palette" size="sm" />
      @for (t of themes; track t) {
        <button
          type="button"
          class="gal-theme"
          [class.is-on]="theme() === t"
          (click)="setTheme(t)"
        >
          {{ t }}
        </button>
      }
    </div>
  </div>

  <!-- ── content: the routed page owns its own scroll ─────────── -->
  <router-outlet />

  <!-- ── footer: dogfooding sh3-app-shell's footer slot ────────── -->
  <footer footer class="gal-footer">
    <div class="gal-footer-meta">
      <a class="gal-footer-brand" routerLink="/" aria-label="Fold — home">
        <sh3-icon name="fold" size="sm" />
        <span>Fold</span>
      </a>
      <span class="gal-footer-ver">v{{ version }}</span>
      <span class="gal-footer-dot" aria-hidden="true">·</span>
      <a
        class="gal-footer-link"
        href="https://github.com/hugoheynard/fold/blob/main/LICENSE"
        target="_blank"
        rel="noopener noreferrer"
        >MIT License</a
      >
      <span class="gal-footer-dot" aria-hidden="true">·</span>
      <span class="gal-footer-copy">© {{ year }} Hugo Heynard</span>
    </div>

    <nav class="gal-footer-links" aria-label="Support and contact">
      <a
        class="gal-footer-link"
        href="https://github.com/hugoheynard/fold"
        target="_blank"
        rel="noopener noreferrer"
      >
        <sh3-icon name="github" size="sm" />
        <span>Star on GitHub</span>
      </a>
      <a
        class="gal-footer-link"
        href="https://www.paypal.com/paypalme/hugoheynard"
        target="_blank"
        rel="noopener noreferrer"
      >
        <sh3-icon name="heart" size="sm" />
        <span>Support</span>
      </a>
      <a class="gal-footer-link" href="mailto:hheynard@gmail.com">
        <sh3-icon name="mail" size="sm" />
        <span>Contact</span>
      </a>
    </nav>
  </footer>
</sh3-app-shell>

<sh3-panel-host />
<sh3-toast-container />
