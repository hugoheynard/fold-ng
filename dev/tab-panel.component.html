<fold-panel-header
  title="Panel with tabs"
  subtitle="an fold-tab-nav inside a side panel"
/>
<div class="pnl-body">
  <fold-tab-nav
    [tabs]="tabs"
    [activeKey]="active()"
    activeStyle="underline"
    (tabChange)="active.set($event)"
  />
  <div class="pnl-content">
    Active tab: <strong>{{ active() }}</strong>
  </div>
</div>
