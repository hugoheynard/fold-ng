<fold-page-section title="Playground" icon="play">
  <div class="pg-row">
    <fold-card class="pg-panel pg-params" padding="none" separators raisedBands>
      <fold-element-title
        cardHeader
        variant="title"
        icon="sliders"
        title="Settings"
      />
      <div class="pg-body pg-params-body">
        <ng-content select="[params]" />
      </div>
    </fold-card>

    <fold-card
      class="pg-panel pg-preview"
      padding="none"
      separators
      raisedBands
    >
      <fold-element-title cardHeader variant="title" icon="eye" title="Preview">
        <!-- mobile only: the code panel collapses; this reveals it as a glass
             overlay over the preview -->
        <fold-button
          titleAction
          class="pg-code-toggle"
          size="sm"
          variant="ghost"
          [icon]="codeOpen() ? 'close' : 'code'"
          (clicked)="toggleCode()"
        >
          Code
        </fold-button>
      </fold-element-title>
      <div cardHeader class="pg-head-actions">
        <ng-content select="[preview-actions]" />
      </div>
      <div class="pg-body pg-preview-body">
        <ng-content />
        @if (codeOpen()) {
          <div class="pg-code-overlay">
            <div class="pg-code-overlay-top">
              <span class="pg-lang">{{ lang() }}</span>
              <div class="pg-code-overlay-actions">
                <fold-button
                  size="sm"
                  variant="ghost"
                  [icon]="copied() ? 'check-circle' : 'copy'"
                  (clicked)="copy()"
                >
                  {{ copied() ? "Copied" : "Copy" }}
                </fold-button>
                <fold-button
                  size="sm"
                  variant="ghost"
                  icon="close"
                  (clicked)="toggleCode()"
                >
                  Close
                </fold-button>
              </div>
            </div>
            <pre
              class="pg-pre pg-code-overlay-pre"
            ><code>{{ code() }}</code></pre>
          </div>
        }
      </div>
    </fold-card>

    <fold-card
      class="pg-panel pg-code"
      surface="sunken"
      padding="none"
      separators
      raisedBands
    >
      <fold-element-title cardHeader variant="title" icon="code" title="Code">
        <div titleAction class="pg-code-actions">
          <span class="pg-lang">{{ lang() }}</span>
          <fold-button
            size="sm"
            variant="ghost"
            [icon]="copied() ? 'check-circle' : 'copy'"
            (clicked)="copy()"
          >
            {{ copied() ? "Copied" : "Copy" }}
          </fold-button>
        </div>
      </fold-element-title>
      <pre class="pg-body pg-pre"><code>{{ code() }}</code></pre>
    </fold-card>
  </div>
</fold-page-section>
