<div class="pg-row">
  <section class="pg-panel pg-params">
    <header class="pg-head">
      <sh3-icon name="settings" size="sm" />
      <span class="pg-head-title">Settings</span>
    </header>
    <div class="pg-body pg-params-body">
      <ng-content select="[params]" />
    </div>
  </section>

  <section class="pg-panel pg-preview">
    <header class="pg-head">
      <sh3-icon name="eye" size="sm" />
      <span class="pg-head-title">Preview</span>
      <div class="pg-head-actions"><ng-content select="[preview-actions]" /></div>
    </header>
    <div class="pg-body pg-preview-body">
      <ng-content />
    </div>
  </section>

  <section class="pg-panel pg-code">
    <header class="pg-head pg-head-code">
      <span class="pg-head-title">Code</span>
      <span class="pg-lang">{{ lang() }}</span>
      <button type="button" class="pg-copy" (click)="copy()">
        <sh3-icon [name]="copied() ? 'check-circle' : 'copy'" size="sm" />
        {{ copied() ? "Copied" : "Copy" }}
      </button>
    </header>
    <pre class="pg-pre"><code>{{ code() }}</code></pre>
  </section>
</div>
