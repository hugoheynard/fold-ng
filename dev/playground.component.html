<div class="pg-row">
  <div class="pg-params">
    <ng-content select="[params]" />
  </div>

  <div class="pg-preview">
    <span class="pg-tag">preview</span>
    <ng-content />
  </div>

  <div class="pg-code">
    <div class="pg-code-top">
      <span class="pg-lang">{{ lang() }}</span>
      <button type="button" class="pg-copy" (click)="copy()">
        <sh3-icon [name]="copied() ? 'check-circle' : 'copy'" size="sm" />
        {{ copied() ? "Copied" : "Copy" }}
      </button>
    </div>
    <pre class="pg-pre"><code>{{ code() }}</code></pre>
  </div>
</div>
