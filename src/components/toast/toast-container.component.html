@for (toast of toastService.toasts(); track toast.id) {
  <div
    [class]="'toast ' + toast.variant"
    (click)="toastService.dismiss(toast.id)"
  >
    <span class="toast-icon">
      @switch (toast.variant) {
        @case ("success") {
          ✓
        }
        @case ("error") {
          ✕
        }
        @case ("warning") {
          ⚠
        }
        @default {
          ℹ
        }
      }
    </span>
    <span class="toast-message">{{ toast.message }}</span>
  </div>
}
