<sh3-avatar
  [name]="resolvedAvatarName()"
  [size]="size()"
  [variant]="variant()"
  [square]="square()"
  [imageUrl]="imageUrl()"
  [muted]="muted()"
  [ring]="ring()"
  [ringStyle]="ringStyle()"
/>
<span class="lines">
  <span class="primary">{{ primary() }}</span>
  @if (hasSecondary()) {
    <span class="secondary">{{ secondary() }}</span>
  }
</span>
