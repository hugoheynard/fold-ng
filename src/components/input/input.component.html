<sh3-input-base
  [label]="label()"
  [for]="inputId"
  [required]="required()"
  [hint]="hint()"
>
  <input
    [id]="inputId"
    [attr.type]="type()"
    [attr.placeholder]="placeholder()"
    [attr.readonly]="readOnly() || null"
    [attr.disabled]="disabled() || null"
    [attr.required]="required() || null"
    [attr.autocomplete]="autocomplete()"
    [value]="value()"
    (input)="onInputChange($event)"
    (blur)="touch.emit()"
  />
</sh3-input-base>
