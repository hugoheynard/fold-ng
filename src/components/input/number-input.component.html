<sh3-input-base
  [label]="label()"
  [for]="inputId"
  [required]="required()"
  [hint]="hint()"
  [error]="errorMessage()"
>
  <ng-template
    #stepBtn
    let-dir="dir"
    let-size="size"
    let-cls="cls"
    let-off="off"
  >
    <button
      type="button"
      tabindex="-1"
      aria-hidden="true"
      [class]="cls"
      [disabled]="off"
      [attr.aria-label]="dir === 1 ? 'Increment' : 'Decrement'"
      sh3RepeatPress
      [sh3RepeatPressDisabled]="off"
      (sh3RepeatPress)="stepBy(dir)"
      (click)="onButtonClick(dir, $event)"
    >
      <sh3-icon [name]="iconFor(dir)" [size]="size" />
    </button>
  </ng-template>

  <div
    class="ni-field"
    [class.ni-inside]="controls() === 'inside'"
    [class.ni-outside]="controls() === 'outside'"
  >
    @if (hasControls() && controls() === "outside") {
      <ng-container
        *ngTemplateOutlet="
          stepBtn;
          context: {
            dir: -1,
            size: 'sm',
            cls: 'ni-btn ni-dec',
            off: decDisabled(),
          }
        "
      />
    }

    <div class="ni-box">
      <input
        [id]="inputId"
        type="number"
        [attr.min]="min()"
        [attr.max]="max()"
        [attr.step]="nativeStep()"
        [attr.placeholder]="placeholder()"
        [attr.readonly]="readOnly() || null"
        [attr.disabled]="disabled() || null"
        [attr.required]="required() || null"
        [attr.aria-invalid]="errorMessage() ? true : null"
        [attr.aria-describedby]="describedBy()"
        [value]="value()"
        (input)="onInputChange($event)"
        (blur)="onBlur()"
        (keydown.arrowUp)="onArrow(1, $event)"
        (keydown.arrowDown)="onArrow(-1, $event)"
        (wheel)="onWheel($event)"
      />

      @if (showStep() && step() != null) {
        <span class="ni-step" aria-hidden="true">{{ step() }}</span>
      }

      @if (hasControls() && controls() === "inside") {
        <span class="ni-stack">
          <ng-container
            *ngTemplateOutlet="
              stepBtn;
              context: {
                dir: 1,
                size: 'xs',
                cls: 'ni-stack-btn ni-inc',
                off: incDisabled(),
              }
            "
          />
          <ng-container
            *ngTemplateOutlet="
              stepBtn;
              context: {
                dir: -1,
                size: 'xs',
                cls: 'ni-stack-btn ni-dec',
                off: decDisabled(),
              }
            "
          />
        </span>
      }
    </div>

    @if (hasControls() && controls() === "outside") {
      <ng-container
        *ngTemplateOutlet="
          stepBtn;
          context: {
            dir: 1,
            size: 'sm',
            cls: 'ni-btn ni-inc',
            off: incDisabled(),
          }
        "
      />
    }
  </div>
</sh3-input-base>
