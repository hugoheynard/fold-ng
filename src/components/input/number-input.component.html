<sh3-input-base
  [label]="label()"
  [for]="inputId"
  [required]="required()"
  [hint]="hint()"
>
  <div
    class="ni-field"
    [class.ni-inside]="controls() === 'inside'"
    [class.ni-outside]="controls() === 'outside'"
  >
    @if (hasControls() && controls() === "outside") {
      <button
        type="button"
        class="ni-btn ni-dec"
        [disabled]="decDisabled()"
        aria-label="Decrement"
        (click)="stepBy(-1)"
      >
        <sh3-icon
          [name]="spinner() === 'arrows' ? 'chevron-down' : 'minus'"
          size="sm"
        />
      </button>
    }

    <div class="ni-box">
      <input
        [id]="inputId"
        type="number"
        [attr.min]="min()"
        [attr.max]="max()"
        [attr.step]="step()"
        [attr.placeholder]="placeholder()"
        [attr.readonly]="readOnly() || null"
        [attr.disabled]="disabled() || null"
        [attr.required]="required() || null"
        [value]="value()"
        (input)="onInputChange($event)"
        (blur)="touch.emit()"
      />

      @if (showStep() && step() != null) {
        <span class="ni-step" aria-hidden="true">{{ step() }}</span>
      }

      @if (hasControls() && controls() === "inside") {
        <span class="ni-stack">
          <button
            type="button"
            class="ni-stack-btn ni-inc"
            [disabled]="incDisabled()"
            aria-label="Increment"
            (click)="stepBy(1)"
          >
            <sh3-icon
              [name]="spinner() === 'arrows' ? 'chevron-up' : 'plus'"
              size="xs"
            />
          </button>
          <button
            type="button"
            class="ni-stack-btn ni-dec"
            [disabled]="decDisabled()"
            aria-label="Decrement"
            (click)="stepBy(-1)"
          >
            <sh3-icon
              [name]="spinner() === 'arrows' ? 'chevron-down' : 'minus'"
              size="xs"
            />
          </button>
        </span>
      }
    </div>

    @if (hasControls() && controls() === "outside") {
      <button
        type="button"
        class="ni-btn ni-inc"
        [disabled]="incDisabled()"
        aria-label="Increment"
        (click)="stepBy(1)"
      >
        <sh3-icon
          [name]="spinner() === 'arrows' ? 'chevron-up' : 'plus'"
          size="sm"
        />
      </button>
    }
  </div>
</sh3-input-base>
