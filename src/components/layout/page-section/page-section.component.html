@if (title() || description()) {
  <div class="section-head">
    @if (title(); as t) {
      <fold-element-title
        [variant]="divider() ? 'bar' : 'eyebrow'"
        [title]="t"
        [icon]="icon()"
      >
        <ng-content select="[sectionActions]" titleAction />
      </fold-element-title>
    }
    @if (description()) {
      <p class="section-desc">{{ description() }}</p>
    }
  </div>
}
<div class="section-body"><ng-content /></div>
