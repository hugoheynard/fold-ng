<section class="ps-root" [attr.aria-labelledby]="title() ? headingId : null">
  @if (title() || description()) {
    <div class="section-head">
      @if (title(); as t) {
        <div class="section-head-row">
          <h2
            class="section-title"
            [id]="headingId"
            [attr.aria-level]="headingLevel() === 2 ? null : headingLevel()"
          >
            @if (collapsible()) {
              <!-- Le bouton est le TITRE, pas l'en-tête : un bouton autour de
                   l'en-tête aurait avalé `[sectionActions]` — « Enregistrer »
                   dans un `<button>` est inerte, et invalide. -->
              <button
                type="button"
                class="section-toggle"
                [attr.aria-expanded]="open()"
                [attr.aria-controls]="bodyId"
                (click)="toggle()"
              >
                <fold-icon
                  class="section-chevron"
                  name="chevron-down"
                  size="sm"
                  aria-hidden="true"
                />
                @if (icon(); as ic) {
                  <fold-icon [name]="ic" size="sm" [tone]="iconTone()" />
                }
                <span class="section-title-text">{{ t }}</span>
              </button>
            } @else {
              @if (icon(); as ic) {
                <fold-icon [name]="ic" size="sm" [tone]="iconTone()" />
              }
              <span class="section-title-text">{{ t }}</span>
            }
          </h2>
          <div class="section-actions">
            <ng-content select="[sectionActions]" />
          </div>
        </div>
      }
      <div class="section-subtitle">
        <ng-content select="[sectionSubtitle]" />
      </div>
      @if (description()) {
        <p class="section-desc">{{ description() }}</p>
      }
    </div>
  }
  <!-- A bespoke header — project [sectionHeader] (e.g. a fold-element-title with
       an icon tile) INSTEAD of `title` when the default h2 isn't enough. The
       parent owns its heading semantics. -->
  <ng-content select="[sectionHeader]" />
  <!-- Seul le CORPS se replie. Le titre, son sous-titre, sa description et ses
       actions restent en place : c'est ce qui sépare replier de cacher. -->
  <div class="section-body" [id]="bodyId" [hidden]="collapsible() && !open()">
    <ng-content />
  </div>
</section>
