<div class="dz-head">
  <fold-icon name="warning" size="sm" class="dz-icon" aria-hidden="true" />
  <h3 class="dz-title" [id]="titleId">{{ title() }}</h3>
</div>

<div class="dz-body">
  <ng-content />
</div>

@if (actionLabel(); as label) {
  <div class="dz-actions">
    <fold-inline-confirm
      [match]="confirmPhrase() ?? ''"
      [message]="message() ?? ''"
      [intent]="intent()"
      (confirmed)="confirmed.emit($event)"
    >
      <button foldButton emphasis="solid" [intent]="intent()">
        {{ label }}
      </button>
    </fold-inline-confirm>
  </div>
}
