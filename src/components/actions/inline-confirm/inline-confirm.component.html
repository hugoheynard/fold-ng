@if (!open()) {
  <!-- Idle: the host's projected trigger. A click anywhere in it starts the
       flow; the trigger itself stays a real focusable control (button / anchor),
       so keyboard activation is native (Enter/Space → click) — no extra
       role/tabindex, and no keydown handler that would double-fire. -->
  <span #triggerWrap class="fic-trigger" (click)="activate()">
    <ng-content />
  </span>
} @else {
  <div
    #groupEl
    class="fic-confirm"
    role="group"
    [attr.aria-label]="l().group"
    (keydown.escape)="cancel(); $event.stopPropagation()"
  >
    @if (message(); as text) {
      <p class="fic-message" [id]="msgId">{{ text }}</p>
    }

    @if (needsInput()) {
      <fold-input
        class="fic-field"
        [label]="prompt()"
        [type]="fieldType()"
        [size]="size() === 'lg' ? 'lg' : 'sm'"
        [placeholder]="placeholder() ?? ''"
        [autocomplete]="password() ? 'current-password' : 'off'"
        [(value)]="typed"
        (keydown.enter)="confirm()"
      />
    }

    <div class="fic-actions">
      <button
        foldButton
        emphasis="solid"
        [intent]="intent()"
        [size]="size()"
        [icon]="confirmIcon()"
        [disabled]="!canConfirm()"
        [attr.aria-describedby]="message() ? msgId : null"
        (click)="confirm()"
      >
        {{ loading() ? l().busy : l().confirm }}
      </button>

      @if (cancelIcon(); as icon) {
        <fold-button-icon
          [icon]="icon"
          tone="ghost"
          [size]="size()"
          [disabled]="loading()"
          [tooltip]="l().cancelAria"
          (clicked)="cancel()"
        />
      } @else {
        <button
          foldButton
          emphasis="soft"
          intent="neutral"
          [size]="size()"
          [disabled]="loading()"
          (click)="cancel()"
        >
          {{ l().cancel }}
        </button>
      }
    </div>
  </div>
}
