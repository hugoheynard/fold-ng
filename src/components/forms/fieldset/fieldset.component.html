<fieldset
  class="fs-box"
  [class]="[direction(), appearance(), legendVariant()]"
  [disabled]="disabled()"
  [attr.aria-label]="label()"
  [attr.aria-describedby]="describedBy()"
>
  @if (legend() !== "") {
    <legend class="fs-legend">
      {{ legend() }}
      @if (optional()) {
        <span class="fs-opt">({{ optionalWord() }})</span>
      }
    </legend>
  }
  @if (hint() !== "") {
    <p class="fs-hint" [id]="hintId">{{ hint() }}</p>
  }
  <ng-content />
</fieldset>
