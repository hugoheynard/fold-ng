<fieldset
  class="fs-box"
  [class]="[direction(), appearance(), legendVariant()]"
  [disabled]="disabled()"
  [attr.aria-label]="label()"
  [attr.aria-describedby]="describedBy()"
>
  @if (legend() !== "") {
    <legend class="fs-legend">{{ legend() }}</legend>
  }
  @if (hint() !== "") {
    <p class="fs-hint" [id]="hintId">{{ hint() }}</p>
  }
  <ng-content />
</fieldset>
