<div
  class="vt"
  role="radiogroup"
  [attr.aria-label]="ariaLabel()"
  (keydown)="onKeydown($event)"
>
  @for (option of options(); track option.value) {
    <button
      type="button"
      role="radio"
      class="vt-btn"
      [class.is-on]="value() === option.value"
      [class.icon-only]="iconOnly() || !option.label"
      [attr.aria-checked]="value() === option.value"
      [attr.aria-label]="option.ariaLabel ?? option.label ?? null"
      [attr.tabindex]="value() === option.value ? 0 : -1"
      [disabled]="option.disabled || null"
      [attr.title]="iconOnly() ? (option.label ?? option.ariaLabel) : null"
      (click)="select(option)"
    >
      @if (option.icon) {
        <fold-icon [name]="option.icon" size="sm" aria-hidden="true" />
      }
      @if (option.label && !iconOnly()) {
        <span class="vt-label">{{ option.label }}</span>
      }
    </button>
  }
</div>
