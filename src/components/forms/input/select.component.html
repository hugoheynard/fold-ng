<fold-input-base
  [label]="label()"
  [for]="inputId"
  [required]="required()"
  [optional]="optional()"
  [optionalLabel]="optionalLabel()"
  [info]="info()"
  [infoLabel]="infoLabel()"
  [hint]="hint()"
  [error]="errorMessage()"
>
  <div class="sel-wrap">
    <select
      [id]="inputId"
      class="sel"
      [disabled]="disabled()"
      [attr.required]="required() || null"
      [attr.aria-invalid]="errorMessage() ? true : null"
      [attr.aria-describedby]="describedBy()"
      [attr.aria-label]="ariaLabel()"
      [value]="value()"
      (change)="onChange($event)"
      (blur)="onBlur()"
    >
      @if (placeholder(); as ph) {
        <option value="" disabled hidden>{{ ph }}</option>
      }
      <ng-content />
    </select>
    <fold-icon
      name="chevron-down"
      size="sm"
      class="sel-caret"
      aria-hidden="true"
    />
  </div>
</fold-input-base>
