@if (label(); as labelText) {
  <div class="ib-label-row">
    <fold-label
      [text]="labelText"
      [for]="for()"
      [required]="required()"
      [optional]="optional()"
      [optionalLabel]="optionalLabel()"
    />
    @if (info(); as infoText) {
      <fold-info [text]="infoText" [label]="infoLabel()" />
    }
  </div>
}

<ng-content />

@if (error(); as errorText) {
  <p
    class="ib-msg ib-error"
    role="alert"
    [attr.id]="for() ? for() + '-error' : null"
  >
    {{ errorText }}
  </p>
} @else if (hint(); as hintText) {
  <p class="ib-msg ib-hint" [attr.id]="for() ? for() + '-hint' : null">
    {{ hintText }}
  </p>
}
