@if (label(); as labelText) {
  <div class="ib-label-row">
    <fold-label
      [text]="labelText"
      [for]="for()"
      [required]="required()"
      [optional]="optional()"
      [optionalLabel]="optionalLabel()"
    />
    @if (info(); as infoText) {
      <fold-popover placement="bottom-end" arrow>
        <button
          foldPopoverTrigger
          type="button"
          class="ib-info"
          [attr.aria-label]="infoLabel()"
        >
          <span aria-hidden="true">i</span>
        </button>
        <div foldPopoverPanel class="ib-info-panel">{{ infoText }}</div>
      </fold-popover>
    }
  </div>
}

<ng-content />

@if (error(); as errorText) {
  <p
    class="ib-msg ib-error"
    role="alert"
    [attr.id]="for() ? for() + '-error' : null"
  >
    {{ errorText }}
  </p>
} @else if (hint(); as hintText) {
  <p class="ib-msg ib-hint" [attr.id]="for() ? for() + '-hint' : null">
    {{ hintText }}
  </p>
}
