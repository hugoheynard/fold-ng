<fold-input
  type="password"
  [label]="label()"
  [placeholder]="placeholder()"
  [hint]="hint()"
  [required]="required()"
  [size]="size()"
  [variant]="variant()"
  [disabled]="disabled()"
  [revealable]="revealable()"
  [autocomplete]="autocomplete()"
  [errors]="errors()"
  [(value)]="value"
  [(touched)]="touched"
/>

<!-- Project into `[rules]` to redesign the checklist off the same state
     (`#pw="foldPasswordField"` → `pw.checklist()`); otherwise the default list
     below is the fallback content. -->
<ng-content select="[rules]">
  @if (checklist().length) {
    <ul class="pw-rules" [attr.aria-label]="rulesLabel()" aria-live="polite">
      @for (rule of checklist(); track rule.label) {
        <li
          class="pw-rule"
          [class.is-met]="rule.met"
          [attr.aria-label]="
            (rule.met ? metLabel() : unmetLabel()) + ': ' + rule.label
          "
        >
          <span class="pw-dot" aria-hidden="true"></span>
          <span class="pw-rule-label">{{ rule.label }}</span>
        </li>
      }
    </ul>
  }
</ng-content>
