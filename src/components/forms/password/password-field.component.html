<fold-input
  type="password"
  [label]="label()"
  [placeholder]="placeholder()"
  [hint]="hint()"
  [required]="required()"
  [size]="size()"
  [variant]="variant()"
  [disabled]="disabled()"
  [revealable]="revealable()"
  [revealLabel]="revealLabel()"
  [hideLabel]="hideLabel()"
  [autocomplete]="autocomplete()"
  [errors]="errors()"
  [(value)]="value"
  [(touched)]="touched"
/>

<!-- Project into `[rules]` to redesign the checklist off the same state
     (`#pw="foldPasswordField"` → `pw.checklist()`); otherwise the default list
     below is the fallback content. -->
<ng-content select="[rules]">
  @if (checklist().length) {
    <ul class="pw-rules" [attr.aria-label]="rulesLabel()" aria-live="polite">
      @for (rule of checklist(); track rule.label) {
        <li class="pw-rule" [class.is-met]="rule.met">
          @if (marker() === "check") {
            <span class="pw-mark" aria-hidden="true">
              @if (rule.met) {
                <fold-icon name="check" size="sm" />
              }
            </span>
          } @else {
            <span class="pw-dot" aria-hidden="true"></span>
          }
          <span class="pw-rule-label">{{ rule.label }}</span>
          <!-- The met/unmet word is real text (not just an attribute), so the
               aria-live region actually announces a rule flipping. -->
          <span class="pw-sr"
            >— {{ rule.met ? metLabel() : unmetLabel() }}</span
          >
        </li>
      }
    </ul>
  }
</ng-content>
