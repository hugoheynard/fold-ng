<div class="rs" role="group" [attr.aria-labelledby]="labelId">
  <span class="rs-label" [id]="labelId">{{ label() }}</span>
  <div class="rs-track-wrap">
    <div class="rs-track">
      <div
        class="rs-fill"
        [style.left.%]="fillLeft()"
        [style.width.%]="fillWidth()"
      ></div>
    </div>
    <input
      type="range"
      class="rs-thumb rs-thumb--min"
      [min]="min()"
      [max]="max()"
      [step]="step()"
      [value]="currentMin()"
      [disabled]="disabled()"
      [attr.aria-label]="label() + ' ' + minLabel()"
      [attr.aria-valuetext]="formatValue(currentMin())"
      (input)="onMinChange($event)"
    />
    <input
      type="range"
      class="rs-thumb rs-thumb--max"
      [min]="min()"
      [max]="max()"
      [step]="step()"
      [value]="currentMax()"
      [disabled]="disabled()"
      [attr.aria-label]="label() + ' ' + maxLabel()"
      [attr.aria-valuetext]="formatValue(currentMax())"
      (input)="onMaxChange($event)"
    />
  </div>
  <span class="rs-values"
    >{{ formatValue(currentMin()) }} – {{ formatValue(currentMax()) }}</span
  >
</div>
