<sh3-card padding="none">
  <div class="cc-head">
    <sh3-element-title
      variant="title"
      [level]="3"
      [icon]="icon()"
      [iconTone]="iconTone()"
      [title]="title()"
      [subtitle]="subtitle()"
    />
  </div>
  <div class="cc-body"><ng-content /></div>
  <div class="cc-foot"><ng-content select="[footer]" /></div>
</sh3-card>
