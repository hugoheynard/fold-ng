@for (panel of panels(); track panel.id) {
  <div
    class="panel-dock"
    [attr.data-side]="panelSide(panel)"
    [class.panel-dock--passthrough]="!isModal(panel)"
    (click)="onBackdrop($event, panel)"
  >
    <aside
      class="panel"
      [attr.data-side]="panelSide(panel)"
      [attr.data-surface]="panelSurface(panel)"
      [style.--panel-width.px]="panel.width()"
      role="dialog"
      [attr.aria-modal]="isModal(panel)"
      [attr.aria-label]="ariaLabel(panel)"
      [attr.aria-labelledby]="ariaLabelledby(panel)"
      tabindex="-1"
      [foldFocusTrap]="shouldTrap(panel)"
      (click)="$event.stopPropagation()"
    >
      @if (hasGrabber(panel)) {
        <button
          type="button"
          class="panel-grabber"
          [attr.aria-label]="dismissLabel"
          (click)="onGrabber(panel)"
        >
          <span class="panel-grabber__bar" aria-hidden="true"></span>
        </button>
      }

      @if (panel.kind === "template") {
        <fold-panel-header
          [title]="panel.title()"
          [subtitle]="panel.subtitle()"
          (closed)="panel.onClose()"
        />
        <div class="panel-body">
          <ng-container [ngTemplateOutlet]="panel.templateRef" />
        </div>
      } @else {
        <ng-container [foldPanelComponentOutlet]="panel" />
      }
    </aside>
  </div>
}
