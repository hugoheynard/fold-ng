@for (a of visible(); track $index) {
  <span class="al-item" [style.z-index]="z($index)">
    <sh3-avatar
      [name]="a.name"
      [imageUrl]="a.imageUrl"
      [colorSeed]="a.colorSeed"
      [size]="size()"
      [square]="square()"
      [variant]="a.variant ?? 'solid'"
      [muted]="a.muted ?? false"
      [ring]="a.ring ?? 'none'"
      [ringStyle]="a.ringStyle ?? 'solid'"
    />
  </span>
}
@if (overflow() > 0) {
  <span class="al-more" [attr.title]="overflow() + ' more'"
    >+{{ overflow() }}</span
  >
}
