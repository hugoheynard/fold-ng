@if (collapsible()) {
  <button
    type="button"
    class="section-head"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="bodyId"
    (click)="toggle()"
  >
    <fold-menu-separator [label]="label()" [color]="color()" [icon]="icon()" />
    <fold-icon
      class="section-chevron"
      [class.is-open]="open()"
      name="chevron-right"
      [size]="12"
      aria-hidden="true"
    />
  </button>
} @else {
  <fold-menu-separator [label]="label()" [color]="color()" [icon]="icon()" />
}

<div
  class="section-items"
  [id]="bodyId"
  [class.foldable]="collapsible()"
  [class.is-collapsed]="!open()"
>
  <ng-content />
</div>
