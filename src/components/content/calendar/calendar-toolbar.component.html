<div class="foldcalt">
  <div class="foldcalt-lead">
    <button type="button" class="foldcalt-today" (click)="goToday()">
      {{ chrome.l().todayAction }}
    </button>

    <div class="foldcalt-steps">
      <button
        type="button"
        class="foldcalt-step"
        [attr.aria-label]="chrome.l().previousPeriod"
        (click)="shift(-1)"
      >
        <fold-icon name="chevron-left" size="sm" />
      </button>
      <button
        type="button"
        class="foldcalt-step"
        [attr.aria-label]="chrome.l().nextPeriod"
        (click)="shift(1)"
      >
        <fold-icon name="chevron-right" size="sm" />
      </button>
    </div>

    @if (titleContent(); as projected) {
      <div class="foldcalt-title" aria-live="polite">
        <ng-container
          [ngTemplateOutlet]="projected"
          [ngTemplateOutletContext]="{
            $implicit: title(),
            from: range().from,
            to: range().to,
            view: view(),
          }"
        />
      </div>
    } @else {
      <h2 class="foldcalt-title" aria-live="polite">{{ title() }}</h2>
    }
  </div>

  <div class="foldcalt-trail">
    @if (options().length > 1) {
      <fold-view-toggle
        size="sm"
        [ariaLabel]="chrome.l().viewSwitch"
        [options]="options()"
        [value]="view()"
        (valueChange)="onViewChange($event)"
      />
    }
    <ng-content select="[actions]" />
  </div>
</div>
