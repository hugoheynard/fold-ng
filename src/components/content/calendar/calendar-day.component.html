<section class="foldcald" [attr.aria-label]="headerLabel()">
  <header class="foldcald-head">
    <span class="foldcald-weekday">{{ weekdayName() }}</span>
    <span
      class="foldcald-daynum"
      [class.is-today]="isToday()"
      [attr.aria-current]="isToday() ? 'date' : null"
      >{{ dayOfMonth() }}</span
    >
    <span class="foldcald-month">{{ monthName() }}</span>
  </header>

  @if (dayEvents().length === 0) {
    <div class="foldcald-empty">
      <p>{{ chrome.l().emptyDay }}</p>
      <!--
        Tag-qualified (rule 4.8): `empty` is also an input on fold-field and
        fold-data-table, and a bare [empty] selector would swallow either whole.
      -->
      <ng-content select="button[empty], a[empty], div[empty]" />
    </div>
  } @else {
    <ul class="foldcald-list">
      @for (event of dayEvents(); track event.id) {
        <li>
          <button
            type="button"
            class="foldcal-chip foldcald-chip"
            [attr.data-tone]="event.tone ?? 'neutral'"
            (click)="eventClick.emit(event)"
          >
            @if (chrome.eventContent(); as projected) {
              <ng-container
                [ngTemplateOutlet]="projected"
                [ngTemplateOutletContext]="{ $implicit: event, band: null }"
              />
            } @else {
              <span class="foldcal-chip-bar"></span>
              @if (event.icon; as icon) {
                <fold-icon class="foldcal-chip-icon" [name]="icon" size="md" />
              }
              <span class="foldcal-chip-body">
                <span class="foldcal-chip-label">{{ event.label }}</span>
                @if (event.subline) {
                  <span class="foldcal-chip-sub">{{ event.subline }}</span>
                }
              </span>
            }
          </button>
        </li>
      }
    </ul>
  }

  <!-- Default slot: anything the qualified selector above did not claim still
       lands somewhere visible instead of disappearing. -->
  <ng-content />
</section>
