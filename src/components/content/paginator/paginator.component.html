@let labels = l();
@let sizes = sizeOptions();

<div class="paginator-left">
  @if (pageSizeOptions().length > 0) {
    <label class="page-size">
      <select
        #pageSizeSelect
        class="page-size__select"
        [value]="pageSize()"
        [disabled]="disabled()"
        (change)="onPageSizeChange(pageSizeSelect.value)"
        [attr.aria-label]="labels.pageSize"
      >
        @for (opt of sizes; track opt) {
          <option [value]="opt" [selected]="opt === pageSize()">
            {{ opt }}
          </option>
        }
      </select>
      <span class="page-size__label">{{ labels.perPage }}</span>
    </label>
  }

  @if (totalItems() > 0) {
    <span class="range">{{
      labels.range(rangeStart(), rangeEnd(), totalItems())
    }}</span>
  } @else {
    <span class="range range--empty">{{ labels.empty }}</span>
  }
</div>

<nav class="pages" [attr.aria-label]="labels.nav">
  <button
    type="button"
    class="nav-btn nav-btn--prev"
    [disabled]="!canGoPrev()"
    (click)="prev()"
    [attr.aria-label]="labels.previous"
  >
    <fold-icon name="chevron-left" [size]="15" />
  </button>

  @for (item of pageItems(); track $index) {
    @if (item.kind === "page") {
      <button
        type="button"
        class="page-btn"
        [class.is-active]="item.page === page()"
        [attr.aria-current]="item.page === page() ? 'page' : null"
        [attr.aria-label]="labels.page(item.page)"
        [disabled]="disabled()"
        (click)="goToPage(item.page)"
      >
        {{ item.page }}
      </button>
    } @else {
      <span class="gap" aria-hidden="true">…</span>
    }
  }

  <button
    type="button"
    class="nav-btn nav-btn--next"
    [disabled]="!canGoNext()"
    (click)="next()"
    [attr.aria-label]="labels.next"
  >
    <fold-icon name="chevron-right" [size]="15" />
  </button>
</nav>
