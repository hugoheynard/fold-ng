<div class="menu-head" #head>
  <ng-content select="[header]" />
  @if (collapsible() && togglePlacement() === "header") {
    <ng-container [ngTemplateOutlet]="toggleTpl" />
  }
</div>

<nav class="menu-body">
  <ng-content />
  @if (collapsible() && togglePlacement() === "body") {
    <ng-container [ngTemplateOutlet]="toggleTpl" />
  }
</nav>

<div class="menu-foot" #foot>
  @if (collapsible() && togglePlacement() === "footer") {
    <ng-container [ngTemplateOutlet]="toggleTpl" />
  }
  <ng-content select="[footer]" />
</div>

<ng-template #toggleTpl>
  <button
    type="button"
    class="menu-toggle"
    [attr.aria-label]="expanded() ? 'Collapse menu' : 'Expand menu'"
    (click)="toggle()"
  >
    <sh3-icon
      [name]="expanded() ? 'chevron-left' : 'chevron-right'"
      [size]="14"
    />
  </button>
</ng-template>
