<fold-page-layout title="element-title">
  <gal-kind-badge titleBadge kind="component" />
  <gal-composed-of [ids]="['icons']" />
  <div class="gal-stack">
    <div class="gal-cell">
      <span class="gal-tag">eyebrow</span>
      <fold-element-title title="Contexte" />
    </div>
    <div class="gal-cell">
      <span class="gal-tag">bar</span>
      <fold-element-title variant="bar" title="Documents" />
    </div>
    <div class="gal-cell">
      <span class="gal-tag">title · iconTone matrix</span>
      <div class="gal-row">
        <fold-element-title
          variant="title"
          icon="company"
          iconTone="primary"
          title="Primary"
          subtitle="filled brand tile"
        />
        <fold-element-title
          variant="title"
          icon="company"
          iconTone="neutral"
          title="Neutral"
          subtitle="raised tile"
        />
        <fold-element-title
          variant="title"
          icon="company"
          iconTone="faded"
          title="Faded"
          subtitle="dim tile"
        />
      </div>
    </div>
  </div>
</fold-page-layout>
