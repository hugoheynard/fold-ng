<fold-page-section title="Playground" icon="play">
  <div class="pg-row">
    <fold-card
      class="pg-panel pg-params"
      padding="none"
      separators="both"
      raisedBands="both"
    >
      <fold-element-title
        cardHeader
        variant="title"
        icon="sliders"
        title="Settings"
      />
      <div class="pg-body pg-params-body">
        <ng-content select="[params]" />
      </div>
    </fold-card>

    <fold-card
      class="pg-panel pg-preview"
      padding="none"
      separators="both"
      raisedBands="both"
    >
      <fold-element-title cardHeader variant="title" icon="eye" title="Preview">
        <!-- responsive: the device/px ruler + width slider ride the header's
             right edge (stacked), so the preview keeps its full height -->
        @if (responsive()) {
          <div titleAction class="pg-vp">
            <div class="pg-vp-devices" role="group" aria-label="Preview width">
              <button
                type="button"
                class="pg-vp-btn"
                title="Fluid — fills the frame"
                [class.is-on]="activeViewport() === 'fluid'"
                [attr.aria-pressed]="activeViewport() === 'fluid'"
                (click)="setViewport(null)"
              >
                <svg class="pg-vp-ic" viewBox="0 0 24 24" aria-hidden="true">
                  <path [attr.d]="fluidIcon" fill="currentColor" />
                </svg>
                <span class="pg-vp-name">Fluid</span>
              </button>
              @for (v of viewports; track v.id) {
                <button
                  type="button"
                  class="pg-vp-btn"
                  [title]="v.label + ' — ' + v.w + 'px'"
                  [class.is-on]="activeViewport() === v.id"
                  [attr.aria-pressed]="activeViewport() === v.id"
                  (click)="setViewport(v.w)"
                >
                  <svg class="pg-vp-ic" viewBox="0 0 24 24" aria-hidden="true">
                    <path [attr.d]="v.d" fill="currentColor" />
                  </svg>
                  <span class="pg-vp-name">{{ v.label }}</span>
                  <span class="pg-vp-px">{{ v.w }}</span>
                </button>
              }
            </div>
            <div class="pg-vp-slider">
              <fold-slider
                ariaLabel="Custom preview width"
                [min]="VP_MIN"
                [max]="VP_MAX"
                [step]="1"
                [showValue]="false"
                [value]="sliderValue()"
                (valueChange)="onSlider($event)"
              />
              <span class="pg-vp-readout">{{
                vpWidth() === null ? "Fluid" : vpWidth() + " px"
              }}</span>
            </div>
          </div>
        }
        <!-- mobile only: the code panel collapses; this reveals it as a glass
             overlay over the preview -->
        <button
          foldButton
          titleAction
          class="pg-code-toggle"
          size="sm"
          emphasis="outline"
          intent="neutral"
          [icon]="codeOpen() ? 'close' : 'code'"
          (click)="toggleCode()"
        >
          Code
        </button>
      </fold-element-title>
      <div cardHeader class="pg-head-actions">
        <ng-content select="[preview-actions]" />
      </div>
      <div class="pg-body pg-preview-body" [class.is-responsive]="responsive()">
        <div class="pg-vp-frame" #vpFrame>
          @if (responsive()) {
            <!-- The device frame: a real iframe (isolated viewport) sized to the
                 chosen device width and scaled to fit. The demo is relocated into
                 it from #vpSrc below, so its @media / container queries resolve at
                 the device width — not the browser window. -->
            <div
              class="pg-vp-stage"
              [class.is-device]="vpWidth() !== null"
              [style.width]="stageWidth()"
              [style.height.px]="stageHeight()"
            >
              <iframe
                class="pg-vp-iframe"
                title="Preview"
                devPreviewFrame
                [source]="vpSrc"
                [themeHost]="themeHostEl"
                [style.width]="iframeWidth()"
                [style.height.px]="contentHeight()"
                [style.transform]="iframeTransform()"
              ></iframe>
            </div>
          }
          <!-- The demo is authored here. Off `responsive`, it projects straight
               into the body (wrappers are display:contents). On `responsive`, the
               frame directive moves this subtree into the iframe. -->
          <div class="pg-vp-src" #vpSrc [class.is-hosted]="responsive()">
            <ng-content />
          </div>
        </div>
        @if (codeOpen()) {
          <div class="pg-code-overlay">
            <div class="pg-code-overlay-top">
              <span class="pg-lang">{{ lang() }}</span>
              <div class="pg-code-overlay-actions">
                <button
                  foldButton
                  size="sm"
                  emphasis="outline"
                  intent="neutral"
                  [icon]="copied() ? 'check-circle' : 'copy'"
                  (click)="copy()"
                >
                  {{ copied() ? "Copied" : "Copy" }}
                </button>
                <button
                  foldButton
                  size="sm"
                  emphasis="outline"
                  intent="neutral"
                  icon="close"
                  (click)="toggleCode()"
                >
                  Close
                </button>
              </div>
            </div>
            <pre
              class="pg-pre pg-code-overlay-pre"
            ><code>{{ code() }}</code></pre>
          </div>
        }
      </div>
    </fold-card>

    <fold-card
      class="pg-panel pg-code"
      surface="sunken"
      padding="none"
      separators="both"
      raisedBands="both"
    >
      <fold-element-title cardHeader variant="title" icon="code" title="Code">
        <div titleAction class="pg-code-actions">
          <span class="pg-lang">{{ lang() }}</span>
          <button
            foldButton
            size="sm"
            emphasis="outline"
            intent="neutral"
            [icon]="copied() ? 'check-circle' : 'copy'"
            (click)="copy()"
          >
            {{ copied() ? "Copied" : "Copy" }}
          </button>
        </div>
      </fold-element-title>
      <pre class="pg-body pg-pre"><code>{{ code() }}</code></pre>
    </fold-card>
  </div>
</fold-page-section>
