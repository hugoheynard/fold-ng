name: Pages

# One GitHub Pages site, two channels on the same `gh-pages` branch:
#   main → /            the public demo (linked from npm `homepage`)
#   dev  → /dev/        an unreleased preview (shows a DEV ribbon)
# They coexist because each deploy targets its own subdir with keep_files.

on:
  push:
    branches: [main, dev]

# peaceiris pushes the built gallery to the `gh-pages` branch.
permissions:
  contents: write

# Never let a main and a dev deploy race on the gh-pages branch; queue instead
# of cancelling so a dev push can't drop a just-started main deploy.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # main → root of the site; dev → the /dev/ subpath, with its own base.
      - name: Resolve channel
        id: chan
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "base=/fold-ng/"     >> "$GITHUB_OUTPUT"
            echo "dest="              >> "$GITHUB_OUTPUT"
          else
            echo "base=/fold-ng/dev/" >> "$GITHUB_OUTPUT"
            echo "dest=dev"           >> "$GITHUB_OUTPUT"
          fi

      - name: Build gallery
        run: pnpm run dev:build
        env:
          PAGES_BASE: ${{ steps.chan.outputs.base }}

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: ${{ steps.chan.outputs.dest }}
          keep_files: true # don't wipe the other channel's subtree
