name: Pages

# Builds the component gallery and publishes it to the `gh-pages` branch, which
# GitHub Pages serves at https://hugoheynard.github.io/fold-ng/ (the demo linked
# from npm `homepage`). The built output goes to gh-pages — the source branches
# (main) never carry build artifacts.

on:
  push:
    branches: [main]

# peaceiris pushes the built gallery to the `gh-pages` branch.
permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Project pages live under /fold-ng/, so the gallery's assets need that
      # prefix. Hash-routing means only the asset prefix has to match.
      - name: Build gallery
        run: pnpm run dev:build
        env:
          PAGES_BASE: /fold-ng/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
