name: Release

# Publishing is opt-in: a push to a branch NEVER publishes. Only pushing a
# version tag (v1.2.3) triggers a release. So demo/doc/component fixes on main
# just redeploy the Pages demo — npm moves only when you deliberately tag.
#
#   git tag v0.2.0 && git push origin v0.2.0        → publishes to `latest`
#   git tag v0.2.0-beta.1 && git push origin …      → publishes to `beta`
#
# One-time setup (see docs/RELEASING.md): npm Trusted Publisher pointing at this
# repo + release.yml. No secret to manage — OIDC only.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm trusted publishing (OIDC) + automatic provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the on-main ancestry check works

      # Release only from main. A tag isn't bound to a branch — this rejects a
      # tag pushed from any commit that isn't on main, so publishing stays a
      # main-only act.
      - name: Tag must be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} is not on main — release only from main"
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      # The tag must match package.json — guards against tagging v0.2.0 while the
      # manifest still says 0.1.0 (which would publish the wrong version).
      - name: Tag matches package.json version
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag v$TAG does not match package.json ($PKG) — bump the version first"
            exit 1
          fi

      # Full gate — never publish a red build (CI is the authority; local hooks
      # can be bypassed with --no-verify).
      - run: pnpm run lint
      - run: pnpm exec tsc --noEmit -p tsconfig.app.json
      - run: pnpm run lint:templates
      - run: pnpm run lint:spacing
      - run: pnpm run api:check
      - run: pnpm test

      # Browser tier (native popover / focus / positioning) — same as ci.yml, so
      # a tag never publishes something the PR gate would have caught.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e

      # Build the publishable artifact (ng-packagr + finalize) + publint + attw.
      - run: pnpm run verify:pack

      # A pre-release tag (v0.2.0-beta.1, has a hyphen) ships on the `beta`
      # dist-tag; a clean version goes to `latest`. This keeps `latest` from ever
      # pointing at a throwaway beta.
      - name: Resolve dist-tag
        id: disttag
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "npm=beta" >> "$GITHUB_OUTPUT"
          else
            echo "npm=latest" >> "$GITHUB_OUTPUT"
          fi

      # Trusted publishing (OIDC): no NPM_TOKEN. npm exchanges the workflow's
      # id-token for a short-lived publish credential, and provenance is
      # automatic. Needs a recent npm — node 22 ships npm 10, OIDC wants >=11.5.1.
      - run: npm install -g npm@latest

      - name: Publish to npm (trusted publishing)
        run: npm publish --access public --tag ${{ steps.disttag.outputs.npm }}
        working-directory: dist

      - name: GitHub Release
        run: |
          FLAG=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && FLAG="--prerelease"
          gh release create "$GITHUB_REF_NAME" --generate-notes $FLAG
        env:
          GH_TOKEN: ${{ github.token }}
